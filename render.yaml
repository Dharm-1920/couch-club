services:
  - type: web
    name: couch-club
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node render-server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: couchclub
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
